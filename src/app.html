<!doctype html>
<html lang="en" class="dark antialiased" style="background-color: #090a0d; color-scheme: dark;">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="dark" />
		<style>
			:root, html, body {
				background-color: #090a0d !important;
				color-scheme: dark;
			}
			#loading-curtain {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: #090a0d;
				transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s ease;
			}
			#loading-curtain.loaded {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			.spinner {
				position: relative;
			}
			.spinner span {
				position: absolute;
				left: 50%;
				top: 50%;
				border-radius: 999px;
				transform-origin: center var(--r);
				background: #FA4615;
				opacity: 0.15;
			}
			.spinner.sm { width: 16px; height: 16px; }
			.spinner.sm span { width: 2.5px; height: 5px; margin-left: -1.25px; margin-top: calc(-1 * var(--r)); --r: 8px; }
			.spinner.md { width: 24px; height: 24px; }
			.spinner.md span { width: 3.5px; height: 7px; margin-left: -1.75px; margin-top: calc(-1 * var(--r)); --r: 12px; }
			.spinner.lg { width: 36px; height: 36px; }
			.spinner.lg span { width: 5px; height: 11px; margin-left: -2.5px; margin-top: calc(-1 * var(--r)); --r: 18px; }
			.spinner span:nth-child(1) { transform: rotate(0deg);   animation: spinner-fade 0.8s 0.000s linear infinite; }
			.spinner span:nth-child(2) { transform: rotate(45deg);  animation: spinner-fade 0.8s 0.100s linear infinite; }
			.spinner span:nth-child(3) { transform: rotate(90deg);  animation: spinner-fade 0.8s 0.200s linear infinite; }
			.spinner span:nth-child(4) { transform: rotate(135deg); animation: spinner-fade 0.8s 0.300s linear infinite; }
			.spinner span:nth-child(5) { transform: rotate(180deg); animation: spinner-fade 0.8s 0.400s linear infinite; }
			.spinner span:nth-child(6) { transform: rotate(225deg); animation: spinner-fade 0.8s 0.500s linear infinite; }
			.spinner span:nth-child(7) { transform: rotate(270deg); animation: spinner-fade 0.8s 0.600s linear infinite; }
			.spinner span:nth-child(8) { transform: rotate(315deg); animation: spinner-fade 0.8s 0.700s linear infinite; }
			@keyframes spinner-fade {
				0%   { opacity: 1; }
				100% { opacity: 0.15; }
			}
		</style>
		<noscript><style>#loading-curtain { display: none !important; }</style></noscript>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<title>CCS Assist</title>
		<meta name="description" content="Official AI-powered student assistant for the College of Computer Studies at Saint Joseph College, Maasin City. Inquire about BSCS, BSIT, ACT, retention rules, enrollment, curriculum, and faculty." />
		<meta name="keywords" content="CCS Assist, Saint Joseph College, SJC Maasin, College of Computer Studies, BSCS, BSIT, ACT, Southern Leyte, Computer Science Philippines, Information Technology" />
		<meta name="author" content="Saint Joseph College - College of Computer Studies" />
		<meta name="theme-color" content="#090a0d" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="CCS Assist" />
		<link rel="canonical" href="https://ccs-assist.pages.dev/" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://ccs-assist.pages.dev/" />
		<meta property="og:site_name" content="CCS Assist" />
		<meta property="og:title" content="CCS Assist - College of Computer Studies | Saint Joseph College" />
		<meta property="og:description" content="AI student assistant for the College of Computer Studies at Saint Joseph College, Maasin City. Explore programs, retention policies, admissions, and faculty info." />
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />
		<meta property="og:image:alt" content="CCS Assist - College of Computer Studies Logo" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="CCS Assist - College of Computer Studies | Saint Joseph College" />
		<meta name="twitter:description" content="AI student assistant for the College of Computer Studies at Saint Joseph College, Maasin City. Instant answers on BSCS, BSIT, ACT, and student guides." />
		<meta name="twitter:image" content="%sveltekit.assets%/og-image.png" />

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "CollegeOrUniversity",
					"@id": "https://ccs-assist.pages.dev/#organization",
					"name": "Saint Joseph College - College of Computer Studies",
					"alternateName": "SJC CCS",
					"url": "https://ccs-assist.pages.dev/",
					"logo": "https://ccs-assist.pages.dev/og-image.png",
					"address": {
						"@type": "PostalAddress",
						"addressLocality": "Maasin City",
						"addressRegion": "Southern Leyte",
						"addressCountry": "PH"
					}
				},
				{
					"@type": "WebApplication",
					"@id": "https://ccs-assist.pages.dev/#webapp",
					"name": "CCS Assist",
					"applicationCategory": "EducationalApplication",
					"operatingSystem": "All",
					"url": "https://ccs-assist.pages.dev/",
					"description": "Interactive AI-powered academic assistant for CCS students, applicants, and faculty at Saint Joseph College.",
					"provider": {
						"@id": "https://ccs-assist.pages.dev/#organization"
					}
				}
			]
		}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" as="style" />
		<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet" />
		<script>
			if ("fonts" in document) {
				Promise.all([
					document.fonts.load('400 1em "Google Sans Flex"'),
					document.fonts.ready
				]).then(() => {
					document.documentElement.classList.add("fonts-loaded");
				}).catch(() => {
					document.documentElement.classList.add("fonts-loaded");
				});
				setTimeout(() => {
					document.documentElement.classList.add("fonts-loaded");
				}, 2000);
			} else {
				document.documentElement.classList.add("fonts-loaded");
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#090a0d] text-zinc-100 antialiased selection:bg-[#FA4615]/30 selection:text-white" style="background-color: #090a0d;">
		<div id="loading-curtain" aria-hidden="true">
			<div class="spinner md">
				<span></span><span></span><span></span><span></span>
				<span></span><span></span><span></span><span></span>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
